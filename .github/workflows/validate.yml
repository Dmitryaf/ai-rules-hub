name: Validate rules hub

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate structure and links
        shell: powershell
        run: ./scripts/check-hub.ps1
      - name: Test commit and sync tooling
        shell: powershell
        run: ./tests/test-tooling.ps1
