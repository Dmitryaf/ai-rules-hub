name: Validate rules hub

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate structure and links
        shell: powershell
        run: ./scripts/check-hub.ps1
      - name: Test commit and sync tooling
        shell: powershell
        run: ./tests/test-tooling.ps1
